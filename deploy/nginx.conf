# /etc/nginx/sites-available/www.opencutlist.org
# Certificate (www + apex) : certbot webroot on /var/www/www.opencutlist.org/acme (deploy/setup.sh)

upstream ocl_site {
  server 127.0.0.1:3008 fail_timeout=0;
}

server {
  listen 80;
  listen [::]:80;
  server_name www.opencutlist.org opencutlist.org;

  location /.well-known/acme-challenge/ { root /var/www/www.opencutlist.org/acme; }
  location / { return 301 https://www.opencutlist.org$request_uri; }
}

# opencutlist.org → www.opencutlist.org
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name opencutlist.org;

  ssl_certificate     /etc/letsencrypt/live/www.opencutlist.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/www.opencutlist.org/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  return 301 https://www.opencutlist.org$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.opencutlist.org;

  ssl_certificate     /etc/letsencrypt/live/www.opencutlist.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/www.opencutlist.org/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_timeout 1d;

  root /var/www/www.opencutlist.org/app/public;

  # Digest-stamped assets served by NGINX directly
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    gzip_static on;
    try_files $uri =404;
  }

  location / {
    try_files $uri @app;
  }

  location @app {
    proxy_pass http://ocl_site;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_redirect off;
  }
}
